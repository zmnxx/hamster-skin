name: build-font

# 手动触发：构建工具栏专用 TTF（重字重 + 长体化子集）。
# 本机 iSH 上 fontTools 处理 17MB 可变字体要几分钟且常被打断，
# 放到 x86 runner 上是十几秒的事。
on:
  workflow_dispatch:
    inputs:
      chars:
        description: '要保留的汉字（工具栏标签用字）'
        required: false
        default: '菜单搜索网址商店常用剪贴脚本收起'
      variants:
        description: 'wght:xscale 组合，逗号分隔'
        required: false
        default: '900:0.78,900:0.85,900:1.00,700:0.85'
      family:
        description: '字族名（OFL 要求改名，勿用原名）'
        required: false
        default: 'YuanshuToolbar'

permissions:
  contents: read

jobs:
  # 只用一个 job：Actions 按 job 向上取整到整分钟计费。
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装依赖
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet fonttools brotli pillow numpy
          # 预览图要渲候选栏与标注的中文，runner 默认没有 CJK 字体
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -c "import fontTools, PIL, numpy; print('fontTools', fontTools.version)"

      - name: 下载源字体 Noto Sans SC 可变字体
        run: |
          set -euo pipefail
          mkdir -p src
          # Google Fonts 官方仓库的可变字体（OFL-1.1）
          curl -fsSL -o src/NotoSansSC-var.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf'
          ls -la src/

      - name: 构建字体变体
        run: |
          set -euo pipefail
          python tools/build_font.py \
            --src src/NotoSansSC-var.ttf \
            --outdir dist/fonts \
            --chars "${{ inputs.chars }}" \
            --variants "${{ inputs.variants }}" \
            --family "${{ inputs.family }}"

      - name: 渲染对照预览图
        run: |
          set -euo pipefail
          python tools/render_preview.py \
            --fontdir dist/fonts \
            --out dist/preview

      - name: 附上许可
        run: |
          set -euo pipefail
          cp tools/FONT_LICENSE.txt dist/fonts/LICENSE.txt
          ls -laR dist/

      - uses: actions/upload-artifact@v4
        with:
          name: toolbar-font
          path: dist/
          retention-days: 7
          if-no-files-found: error
